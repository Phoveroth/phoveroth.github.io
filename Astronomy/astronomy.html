<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="shortcut icon" type="image/x-icon" href="../Images/favicon.ico" />
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Astronomy</title>
        <link rel="stylesheet" type="text/css" href="VSASTUCKMAIN.CSS">
        <style>
            body {
                background-color: #0b0b0b;
            }

            h1 {
                font-size: 40px;
                font-weight: bold;
                font-family: 'Courier New', Courier, monospace;
                color: #ffffff;
                text-align: center;
            }

            .main{
                border: 5px outset rgb(180, 30, 210);
                background-color: #282828;
                width: 1100px;
                margin: auto;
            }
            .upperarea{
                margin: auto;
                width: 800px;
            }
            .grayarea{
                width: 800px;
                margin: auto;
                background-color: #161616;
            }
            .photo{
                width: 800px;
                display: block;
                margin-left: auto;
                margin-right: auto;
            }
            .textbox{
                width: 700px;
                margin: auto;
            }

            .storytext{
                font-family: 'Adobe Garamond Pro Regular';
                font-size: 22px;
                text-align: center;
                color: rgb(192, 192, 192);
            }
        </style>
    </head>

    <body>
        <div class="main">
            <h1>Astronomy</h1>

            <div class="grayarea">
                <br>
                <div class="textbox">   
                    <p class="storytext">
                        Determine the distance between two celestial objects in our Solar System.
                    </p>

                    <pre class="storytext" id="out">Click the button</pre>

                    <button id="button">Click</button> 

                    <form action="https://ssd.jpl.nasa.gov/api/horizons.api" method="GET" target="_blank">
                        <input type="hidden" name="format" value="text">
                        <input type="hidden" name="COMMAND" value="'499'">
                        <input type="hidden" name="OBJ_DATA" value="'NO'">
                        <input type="hidden" name="MAKE_EPHEM" value="'YES'">
                        <input type="hidden" name="EPHEM_TYPE" value="'OBSERVER'">
                        <input type="hidden" name="CENTER" value="'500@399'">
                        <input type="hidden" name="START_TIME" value="'2026-11-05'">
                        <input type="hidden" name="STOP_TIME" value="'2026-11-06'">
                        <input type="hidden" name="STEP_SIZE" value="'1 d'">
                        <input type="hidden" name="QUANTITIES" value="'1,20'">
                        <button>Get Mars position</button>
                    </form>
                </div>
                <br>
            </div>
            <br>
        </div>

        <script>

            const params = new URLSearchParams({
              format: "json",
              COMMAND: "'499'",        // Mars
              OBJ_DATA: "'NO'",
              MAKE_EPHEM: "'YES'",
              EPHEM_TYPE: "'OBSERVER'",
              CENTER: "'500@399'",     // geocentric
              START_TIME: "'2026-11-05'",
              STOP_TIME: "'2026-11-06'",
              STEP_SIZE: "'1 d'",
              QUANTITIES: "'1,20'"     // RA/DEC, range
            });
            const api = "https://ssd.jpl.nasa.gov/api/horizons.api?" + params;
            const enc = encodeURIComponent(api);
        
            const routes = [
              ["allorigins", "https://api.allorigins.win/raw?url=" + enc],
              ["corsproxy",  "https://corsproxy.io/?url=" + enc]
            ];
        
            document.getElementById("button").onclick = async () => {
              const out = document.getElementById("out");
              out.textContent = "Loading...";
              for (const [name, url] of routes) {
                try {
                  const res = await fetch(url);
                  const data = await res.json();
                  out.textContent = "(via " + name + ")\n" + (data.result.includes("$$SOE")
                    ? data.result.split("$$SOE")[1].split("$$EOE")[0].trim()
                    : data.result);
                  return;
                } catch (e) {
                  console.log(name + " failed:", e);
                }
              }
              out.textContent = "All proxies failed. See the Console (F12).";
            };
        </script>

    </body>
</html>
