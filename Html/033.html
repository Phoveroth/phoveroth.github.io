<!DOCTYPE html>
<html lang='en'>
    <head>
        <link rel='shortcut icon' type='image/x-icon' href='../Images/favicon.ico' />
        <meta charset='UTF-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>Vstuck</title>
        <link rel='stylesheet' type='text/css' href='VSASTUCKMAIN.CSS'>
        <style>
        .main{
            width: 1100px;
            margin: auto;
        }
        .upperarea{
            margin: auto;
            width: 700px;
        }

        .grayarea{
            width: 700px;
            margin: auto;
        }

        .photo{
            width: 700px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .textbox{
            width: 600px;
            margin: auto;
        }

        body {
            background-image: url('../Images/stars.png');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
            opacity: 1;
            transition: opacity 3s ease-in;
        }

        </style>
    </head>
    <body>
        <div id="fade-overlay"></div>
        <div class='main'>
            <h1>What???</h1>
            <div class='upperarea'>
                <button id="audio-button">
                    <audio id="audio-file" src="../Audio/033.mp3"></audio>
                    Play Audio
                </button>
                <img class='photo' src='../Images/033.png' alt='Image could not be found' >
            </div>
            <div class='grayarea'>
                <br>
                <div class='textbox'>
                    <a href='034.html' class='next'>==></a>
                </div>
                <br>
            </div>
            <br><a href='032.html' class='goback'>Go Back</a>
        </div>
        <script>
            const button = document.querySelector('#audio-button');
            const audio = document.querySelector('#audio-file');
            button.addEventListener('click', function() {audio.currentTime = 0;audio.play();});

            window.addEventListener("load", () => {
                const overlay = document.getElementById("fade-overlay");
                overlay.style.opacity = "0";
                setTimeout(() => {
                    overlay.style.display = "none";
                }, 3000);
            });
        </script>
    </body>
</html>
