<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fade In Example</title>
  <style>
    /* CSS Styling */
    body{
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* Prevent scrolling during animation */
    }

    #fade-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 9999;
      opacity: 1;
      transition: opacity 2s ease; /* Adjust duration as needed */
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .content h1, .content p {
      color: white;
    }
  </style>
</head>
<body>
  <div id="fade-overlay"></div>
  <div class="content">
    <h1>Welcome to My Website</h1>
    <p>This is the content of your site.</p>
  </div>
  <script>
    // JavaScript for Fade Effect
    window.addEventListener("load", () => {
      const overlay = document.getElementById("fade-overlay");
      overlay.style.opacity = "0"; // Start fading out
      setTimeout(() => {
        overlay.style.display = "none"; // Hide overlay after fade-out
        document.body.style.overflow = "auto"; // Re-enable scrolling
      }, 2000); // Match the duration in the CSS transition
    });
  </script>
</body>
</html>
