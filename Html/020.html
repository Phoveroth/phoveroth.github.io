<!DOCTYPE html>
<html lang='en'>
    <head>
        <link rel="shortcut icon" type="image/x-icon" href="../Images/favicon.ico" />
        <meta charset='UTF-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>Vstuck</title>
        <link rel='stylesheet' type='text/css' href='VSASTUCKMAIN.CSS'>
        <style>
            body{
                background-color: #000000;
            }

            .main{
                background-color: #000000;
                width: 1100px;
                margin: auto;
            }

            .upperarea{
                margin: auto;
                width: 800px;
            }

            .grayarea{
                width: 800px;
                margin: auto;
                background-color: #000000;
            }

            .photo{
                width: 800px;
                display: block;
                margin-left: auto;
                margin-right: auto;
            }
            
            .textbox{
                width: 700px;
                margin: auto;
            }
        </style>
    </head>
    <body>
        <div class='main'>
            <h1>Regret</h1>
            <div class='upperarea'>
                <button id="audio-button">
                    <audio id="audio-file" src="../Audio/020.mp3"></audio>
                    Play Audio
                </button>
                <img class='photo' src='../Images/020.gif' alt='Image could not be found' ></div>
            <div class='grayarea'>
                <br>
                <div class='textbox'>
                    <p class='storytext'>It was cold. And in that cold paralysis of hopelessness, conversation was their only solace. Aegis spoke out.</p>
                    <p class='speak aegis'>Aegis: We should have listened to Atlas, he tried to warn us about them. I don't know what will happen to us now.</p>
                    <a href='021.html' class='next'>> The Gang Is United</a>
                </div>
                <br>
            </div>
            <br><a href='019.html' class='goback'>Go Back</a>
        </div>
        <script>
            const button = document.querySelector('#audio-button');
            const audio = document.querySelector('#audio-file');
            button.addEventListener('click', function() {audio.currentTime = 0;audio.play();});
        </script>
    </body>
</html>
